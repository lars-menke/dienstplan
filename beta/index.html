<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dienstplan</title>
<meta name="robots" content="noindex">
<!-- Die Testversion ist jetzt die normale App. Alte Links (auch mit #code=…) und das
     Beta-Symbol auf dem Startbildschirm landen hier und werden weitergeleitet. -->
<script>
  (function () {
    try {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (/\/beta\/$/.test(r.scope)) r.unregister(); });
        });
      }
    } catch (e) { /* egal */ }
    location.replace('../' + location.hash);
  })();
</script>
