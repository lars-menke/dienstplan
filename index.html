<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dienstplan</title>
<meta name="description" content="Dienstplan der Feuerwehr – Termine verwalten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dienstplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Anmeldung -->
  <section class="login" id="login" hidden>
    <div class="login-box">
      <img src="icon-192.png" alt="">
      <h1>Dienstplan</h1>
      <p>Bitte deinen persönlichen Zugangscode eingeben.</p>
      <form id="loginForm">
        <input id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false"
               placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" aria-label="Zugangscode">
        <button class="btn" type="submit" id="loginBtn">Anmelden</button>
      </form>
      <div class="err" id="loginErr" role="alert"></div>
      <small>Den Code bekommst du von der Person, die den Dienstplan pflegt.</small>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="top">
      <div class="wrap">
        <div class="top-row">
          <div class="brand">
            <h1>🚒 Dienstplan</h1>
            <small>Feuerwehr Kalender-Sync</small>
          </div>
          <button class="icon-btn" id="btnMore" aria-label="Weitere Aktionen">⋯</button>
          <button class="icon-btn" id="btnReload" aria-label="Neu laden">↻</button>
        </div>
        <div class="tools">
          <div class="seg" role="group" aria-label="Zeitraum">
            <button data-tab="upcoming" aria-pressed="true">Kommend</button>
            <button data-tab="past" aria-pressed="false">Vergangen</button>
          </div>
          <input class="search" id="q" type="search" placeholder="Suchen…" autocomplete="off" aria-label="Suchen">
        </div>
        <div class="stale" id="stale" hidden></div>
      </div>
    </header>

    <main id="list" class="wrap"></main>

    <button class="fab" id="btnNew">＋ Termin</button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
